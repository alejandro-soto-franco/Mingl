[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mingle-hl"
version = "0.0.1"
description = "Mixture-based Identification of Neighborhood Gradients with Likelihood estimates."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
   
    { name = "Kyra Van Batavia", email = "kyra.vanbatavia@duke.edu"},
    { name = "Annette Chen", email = "annette.chen@duke.edu" },
    { name = "James Wright", email = "james.wright@duke.edu" },
]
authors = [
  { name = "Kyra Van Batavia"},
  { name = "Annette Chen"},
  { name = "James Wright" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "anndata>=0.10,<0.13",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3.0",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "networkx>=3.2,<4",
  "tqdm>=4.66,<5",
  "session-info2",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://mingl.readthedocs.io/"
urls.Homepage = "https://github.com/HickeyLab/Mingl"
urls.Issues = "https://github.com/HickeyLab/Mingl/issues"
urls.Source = "https://github.com/HickeyLab/Mingl"

[dependency-groups]
dev = [
  "build>=1.2",
  "pre-commit",
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "pytest",
]
doc = [
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]

[tool.hatch]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
envs.docs.dependency-groups = [ "doc" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.hatch-test.dependency-groups = [ "dev", "test" ]
envs.hatch-test.matrix = [
  { deps = [ "stable" ], python = [ "3.11", "3.14" ] },
  { deps = [ "pre" ], python = [ "3.14" ] },
]
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = [ "pre" ] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/mingl", "src/MINGLE"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 120
src = [ "src" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401", "F403" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
# src/mingl/pl and src/mingl/tl predate this workflow conversion. The
# workflow-spec bug fixes (see README's "Differences from upstream") touch
# specific functions in a handful of tl/ files and each has a regression
# test; sweeping the rest of these two packages for docstrings, broad
# `except Exception:` clauses, relative imports and comprehension style
# would mean rewriting logic no test protects, well beyond that fix list, so
# it is left alone and these pre-existing conventions are not re-flagged.
lint.per-file-ignores."src/mingl/pl/*" = [ "BLE001", "D101", "D102", "D103", "D200", "D205", "D301", "TID252", "B905", "B023", "C401", "C403", "C405", "C414", "F841" ]
lint.per-file-ignores."src/mingl/tl/*" = [ "BLE001", "D101", "D102", "D103", "D200", "D205", "D301", "TID252", "B905", "B023", "C401", "C403", "C405", "C414" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
strict = true
testpaths = [ "tests" ]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]
run.source = [ "mingl", "MINGLE" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.md",
]

[tool.pyrefly]
project-includes = [ "src", "workflow", "tests" ]
# gmm_gpu.py imports cupy unconditionally and is never imported by
# mingl.tl.__init__ for exactly this reason (see README); this machine, and
# CI, have no GPU or cupy install to check it against. pl/enrichment.py
# predates this workflow conversion and is untouched by it; its
# `not-iterable` errors trace to a pre-existing helper whose fix is outside
# the confirmed-bug list this task covers (see README's
# "Differences from upstream").
project-excludes = [ "**/gmm_gpu.py", "**/pl/enrichment.py" ]
python-version = "3.11"

# pandas/anndata's overload-heavy, partly-untyped stubs make these
# categories fire on almost every DataFrame construction, .loc/.obsm access
# and AnnData assignment in this codebase -- not on a real type error. Left
# at the default "error" severity they would drown out (and, per the counts
# checked while wiring up this workflow, vastly outnumber) any signal from
# the categories below, which stay at "error": undefined names, wrong
# arities, missing imports.
[tool.pyrefly.errors]
no-matching-overload = "ignore"
bad-argument-type = "ignore"
bad-index = "ignore"
missing-attribute = "ignore"
unsupported-operation = "ignore"
bad-assignment = "ignore"

[tool.pixi.workspace]
channels = [ "conda-forge", "bioconda" ]
platforms = [ "linux-64" ]

[tool.pixi.dependencies]
python = ">=3.11,<3.15"
anndata = ">=0.10,<0.13"
numpy = ">=1.26,<3"
pandas = ">=2.2,<3.0"
scipy = ">=1.12,<2"
scikit-learn = ">=1.4,<2"
matplotlib = ">=3.8,<4"
seaborn = ">=0.13,<0.14"
networkx = ">=3.2,<4"
tqdm = ">=4.66,<5"
pytest = "*"
snakemake-minimal = ">=8,<9"

[tool.pixi.pypi-dependencies]
mingle-hl = { path = ".", editable = true }
session-info2 = "*"

[tool.pixi.feature.lint.dependencies]
ruff = "*"

[tool.pixi.feature.lint.pypi-dependencies]
pyrefly = "==1.0.0"

[tool.pixi.environments]
default = { features = [ "lint" ], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check src workflow tests && ruff format --check src workflow tests && pyrefly check"
smoke = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml config/smoke.yaml --cores 6 --rerun-incomplete all"
all = "snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --cores 6 --rerun-incomplete all"
