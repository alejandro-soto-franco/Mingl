# Mingl workflow configuration.
#
# Every parameter the original notebooks hardcoded lives here instead: column
# names, k-window sizes, thresholds, seeds and data sources. See README.md
# for the "Differences from upstream" section this config implements.

paths:
  data_dir: "data"
  results_dir: "results"

# Path to a lock file to `flock` around any rule that reads a large shared
# dataset (see datasets.intestine.source.local_path below): set this only on
# a machine where that data is actually shared with other concurrent
# workflows. `null` (the default, and what CI and a fresh clone get) means no
# locking -- rules run unlocked, which is correct and safe for a single-user
# checkout. Set it per machine, e.g. in a local, gitignored
# config/local.yaml passed as a second --configfile, or override it with the
# MINGL_LOCK_PATH environment variable.
lock_path: null

# Small, deterministic, in-repo fixtures (no download): the exact stored
# output of the deleted SyntheticGradientTest{Fast,Medium,Slow}.ipynb
# notebooks, generated by FunctionsSimulator.ipynb with seed=42. This is the
# workflow's fully reproducible, real (not synthetic-for-testing-only)
# parity target; see tests/test_parity.py and README's parity table.
simulated_transitions:
  fixture_dir: "tests/fixtures/simulated_transitions"
  variants: [fast, medium, slow]
  cluster_col: cell_type
  neighborhood_col: Neighborhood
  region_key: unique_region
  k: 10
  ks: [10]
  threshold: 0.25
  # range(1, 51) in FunctionsSimulator.ipynb's n-cluster sweep (fig6-style).
  n_cluster_range: [1, 51]

# Manuscript datasets. None ship with this repository (see README): each
# `source` names the best-attested public archive this workflow could find
# for it, with the exact file the download rule fetches and verifies by
# SHA-256 once it is obtainable. `sha256: null` means the checksum has not
# been computed yet, because the source could not be fetched from this
# environment; see README's "Data availability" section for why, and fill
# it in from a real download before relying on the `download_*` rules.
datasets:
  intestine:
    source:
      description: >-
        Processed single-cell CODEX data from Hickey et al. 2023, Nature
        ("Organization of the human intestine at single-cell resolution").
      dryad_doi: "10.5061/dryad.pk0p2ngrf"
      download_url: "https://datadryad.org/api/v2/files/2572152/download"
      filename: "23_09_CODEX_HuBMAP_alldata_Dryad_merged.csv"
      size_bytes: 2910503850
      sha256: "2e466b80980588c19585906a37547c91f227d2ff88b184f6f2f9015af8bab432"
      # Obtained via a browser-authenticated download (Dryad's plain HTTPS
      # file endpoint returns 401/403 to unauthenticated requests, see
      # README). Column names and unique_region values (e.g.
      # "B004_Ascending", "B006_Descending - Sigmoid") match the deleted
      # notebooks exactly: this is the file they read, already containing
      # precomputed Neighborhood/Community/Tissue Unit assignments (no
      # derivation step needed).
      #
      # A relative path under data/ (itself gitignored, see README): put the
      # real file there yourself, or symlink it in from wherever it actually
      # lives on your machine (this file may be large and shared with other
      # workflows; nothing about that is specific to this repository).
      local_path: "data/raw/intestine/23_09_CODEX_HuBMAP_alldata_Dryad_merged.csv"
      # The notebooks' own stored output reports 2,512,002 cells; this file
      # has 2,603,217. Dropping rows missing this column is the closest
      # reconstruction found (2,512,185 cells, 183 away); see README.
      reconstructed_filter_col: "Tissue Unit"
    # ks is a single value per tier, not the notebooks' own (10, 20, 100, 300)
    # for every tier: KNN2 queries n_neighbors=max(ks) per cell across all
    # 2.6M cells, so requesting 300 neighbours to use only k=10 (as the
    # neighbourhood-tier notebook did) needlessly multiplies the peak memory
    # this shared, memory-capped machine can spend by 30x. See README's
    # "Differences from upstream".
    neighborhood:
      cluster_col: "Cell Type"
      neighborhood_col: "Neighborhood"
      region_key: "unique_region"
      x_key: "x"
      y_key: "y"
      k: 10
      ks: [10]
      threshold: 0.25
    tissue_unit:
      cluster_col: "Community"
      neighborhood_col: "Tissue Unit"
      region_key: "unique_region"
      x_key: "x"
      y_key: "y"
      k: 300
      ks: [300]
      threshold: 0.25
    community:
      cluster_col: "Neighborhood"
      neighborhood_col: "Community"
      region_key: "unique_region"
      x_key: "x"
      y_key: "y"
      k: 100
      ks: [100]
      threshold: 0.25
    # One region used by the manuscript for a single-region gradient figure
    # (formerly gb()'s hardcoded default; now explicit here only).
    example_region_value: "B006_Descending - Sigmoid"
    # fig6: run_mingl_over_n_clusters re-clusters the same k=10 composition
    # window at every candidate cluster count. full_n_range is the complete
    # sweep the notebook ran (1..50, exclusive end); this DAG defines a job
    # per n across that whole range, but selected_n -- the three cluster
    # counts the notebook's own elbow/plateau selection actually used,
    # N=6/17/28, per fig6_intestine_n_neighborhood.md -- is what this
    # session's `pixi run all`-equivalent actually requests, since a
    # 2.6M-cell KMeans+GMM pass per n makes the full sweep a multi-hour,
    # not a 30-minute, undertaking. See README.
    n_neighborhood_sweep:
      cluster_col: "Cell Type"
      region_key: "unique_region"
      x_key: "x"
      y_key: "y"
      k: 10
      full_n_range: [1, 51]
      selected_n: [6, 17, 28]

  melanoma:
    source:
      description: >-
        CODEX multiplexed imaging of immunotherapy in human and mouse
        melanomas.
      dryad_doi: "10.5061/dryad.k0p2ngfcc"
      download_url: "https://datadryad.org/api/v2/files/2802021/download"
      filename: "23_10_11_Melanoma_Marker_Cell_Neighborhood.csv"
      size_bytes: 5011665091
      sha256: null
    neighborhood:
      cluster_col: "Cell_Type"
      neighborhood_col: "Neighborhood"
      region_key: "filename"
      x_key: "x"
      y_key: "y"
      k: 10
      ks: [10, 20, 100, 300]
      threshold: 0.25

  esophagus:
    source:
      description: >-
        Barrett's esophagus progression CODEX data. Source not identified:
        no URL, DOI or portal reference exists anywhere in the deleted
        notebooks, only the local filename `all_regions_from_h5mu.csv`. See
        README's "Data availability" section.
      dryad_doi: null
      download_url: null
      filename: null
      size_bytes: null
      sha256: null
    neighborhood:
      cluster_col: "Cell Type"
      neighborhood_col: "neigh_name"
      region_key: "region"
      cellid_col: "cellid"
      k: 10
      ks: [10, 20, 100, 300]
      threshold: 0.25
    contexts: [Normal, Metaplasia, Dysplasia, Tumor]
    min_count: 10
